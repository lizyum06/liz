<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-Discovery — The Scholar Edu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Wix에서 이 블록이 놓이는 섹션 배경색을 #f7f4ec(크림)로 맞추면 경계 없이 자연스럽습니다. */
  :root { --bg:#f7f4ec; --surface:#ffffff; --text:#14233a; --muted:#5f6879; --border:#e3dfd2; --accent:#9a7632; --btn-bg:#14233a; --btn-fg:#f7f4ec; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px; background: var(--bg); color: var(--text);
         font: 16px/1.7 "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; word-break: keep-all; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h2 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: -0.02em; }
  .lead { margin: 0 0 18px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .chip { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg); }
  .chip:disabled { opacity: .45; cursor: not-allowed; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .result { padding: 20px; background: var(--surface); border: 1px dashed var(--border); border-radius: 16px; }
  .result p { margin: 0 0 8px; }
  .result h3 { margin: 0 0 8px; font-size: 1.05rem; }
  .result ul { margin: 0; padding-left: 20px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h2 id="title"></h2>
  <p class="lead" id="lead"></p>
  <div id="chips" class="chips" role="group"></div>
  <div id="result" class="result" aria-live="polite"></div>
</div>

<script>
/* 언어 설정: "ko" 또는 "en" 으로 바꾸세요. */
const LANG = "ko";

const TEXT = {
  ko: {
    title: "5분 자기 탐색",
    lead: "검사 → 진로 결정이 아니라, 간단한 탐색 → 경험 추천. 끌리는 것을 골라 보세요. (최대 3개)",
    empty: "관심사를 선택하면 추천 경험이 여기에 나타납니다.",
    picked: "선택한 관심사",
    cta: "직접 경험해 보면 어떨까요?",
    group: "관심사 선택",
  },
  en: {
    title: "5-Minute Self-Discovery",
    lead: "Not a test that decides your career, but a short exploration that suggests experiences. Pick up to three that appeal to you.",
    empty: "Pick your interests and suggested experiences will appear here.",
    picked: "Your profile suggests you may enjoy",
    cta: "Why not experience it?",
    group: "Choose your interests",
  },
};

const INTERESTS = {
  Research:         { ko: "연구",   en: ["University Science Lab Visit", "Research Facility STEM Day"],                   kos: ["대학 과학 실험실 방문", "연구시설 STEM 체험의 날"] },
  People:           { ko: "사람",   en: ["Healthcare Mentor Session", "School & Boarding Experience"],                      kos: ["의료 분야 멘토 세션", "학교 & 기숙사 체험"] },
  "Problem-solving":{ ko: "문제 해결", en: ["Design the Metro Station of the Future (mini challenge)", "Engineering Experience Day"], kos: ["미래의 지하철역 설계 (미니 챌린지)", "공학 체험의 날"] },
  Building:         { ko: "만들기", en: ["Infrastructure Experience (metro, dam, water)", "Urban Planning Design Challenge"], kos: ["인프라 체험 (지하철 · 댐 · 수자원)", "도시계획 디자인 챌린지"] },
  Nature:           { ko: "자연",   en: ["Environment & Water Experience", "Conservation / Field Study Day"],              kos: ["환경 & 수자원 체험", "자연 보전 · 현장 학습의 날"] },
  Creativity:       { ko: "창의성", en: ["Future City Design Project", "Media & Design Mentor Session"],                    kos: ["미래 도시 디자인 프로젝트", "미디어 · 디자인 멘토 세션"] },
  Technology:       { ko: "기술",   en: ["AI & Technology Mentor Session", "STEM Innovation Experience"],                   kos: ["AI · 기술 멘토 세션", "STEM 혁신 체험"] },
  Leadership:       { ko: "리더십", en: ["Parliament & Policy Experience", "School Leadership & Sport Day"],                kos: ["국회 · 정책 체험", "학교 리더십 & 스포츠의 날"] },
};

const T = TEXT[LANG];
const MAX_PICKS = 3;
const picked = new Set();
const chips = document.getElementById("chips");
const result = document.getElementById("result");
const label = (k) => (LANG === "ko" ? INTERESTS[k].ko : k);
const items = (k) => (LANG === "ko" ? INTERESTS[k].kos : INTERESTS[k].en);

document.documentElement.lang = LANG;
document.getElementById("title").textContent = T.title;
document.getElementById("lead").textContent = T.lead;
chips.setAttribute("aria-label", T.group);

function render() {
  chips.querySelectorAll(".chip").forEach((b) => {
    const on = picked.has(b.dataset.key);
    b.setAttribute("aria-pressed", on);
    b.disabled = !on && picked.size >= MAX_PICKS;
  });
  if (!picked.size) {
    result.innerHTML = '<p class="muted"></p>';
    result.firstChild.textContent = T.empty;
  } else {
    const list = [...new Set([...picked].flatMap(items))];
    result.innerHTML = "<h3></h3><p></p><ul></ul>";
    result.querySelector("h3").textContent = `${T.picked}: ${[...picked].map(label).join(", ")}`;
    result.querySelector("p").textContent = T.cta;
    const ul = result.querySelector("ul");
    list.forEach((t) => { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
  }
  // Wix 임베드 높이가 내용에 맞게 늘어나도록 부모에게 알림(지원하지 않아도 무해)
  try { parent.postMessage({ type: "se-height", height: document.documentElement.scrollHeight }, "*"); } catch (e) {}
}

Object.keys(INTERESTS).forEach((key) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip";
  b.dataset.key = key;
  b.textContent = label(key);
  b.addEventListener("click", () => { picked.has(key) ? picked.delete(key) : picked.add(key); render(); });
  chips.appendChild(b);
});
render();
</script>
</body>
</html>
